<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Guy — The GC's Office</title>
  <meta name="description" content="Your private contractor roster. Quick-action call, text, and share. Add manually or scan a business card." />
  <meta property="og:title" content="My Guy — The GC's Office" />
  <meta property="og:description" content="Your private contractor roster. Quick-action call, text, and share. Add manually or scan a business card." />
  <meta property="og:image" content="https://shannon-goddard.github.io/the-gcs-office/img/preview.png" />
  <meta property="og:url" content="https://shannon-goddard.github.io/the-gcs-office/my-guy.html" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="My Guy — The GC's Office" />
  <meta name="twitter:description" content="Your private contractor roster. Quick-action call, text, and share. Add manually or scan a business card." />
  <meta name="twitter:image" content="https://shannon-goddard.github.io/the-gcs-office/img/preview.png" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2354585A'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='20' font-family='system-ui' font-weight='900' fill='white'>G</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --brand: #54585A; --accent: #A0272D; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 100vw; overflow-x: hidden; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 50; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .guy-card { transition: box-shadow 0.15s; }
    .guy-card:active { box-shadow: 0 0 0 2px #A0272D33; }
    .tab-btn.active { background: #A0272D; color: #fff; }
    .tab-btn { background: #f3f4f6; color: #374151; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Header -->
  <header style="background:#54585A" class="text-white px-4 py-3 flex items-center justify-between sticky top-0 z-40 shadow">
    <div class="flex items-center gap-3">
      <a href="index.html" class="text-gray-300 hover:text-white text-sm">← Rolodex</a>
      <span class="text-gray-500">|</span>
      <span class="text-lg font-black tracking-tight">My Guy</span>
    </div>
    <button onclick="openAddModal()" style="background:#A0272D" class="text-white text-sm font-bold px-4 py-1.5 rounded-full hover:opacity-90 transition">
      + Add
    </button>
  </header>

  <!-- Search -->
  <div class="bg-white border-b border-gray-200 px-4 py-2">
    <input id="searchInput" type="text" placeholder="Search name, trade, or phone…"
      oninput="filterGuys()"
      class="w-full border border-gray-200 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-300" />
  </div>

  <!-- Trade filter tabs -->
  <div class="bg-white border-b px-4 py-2 overflow-x-auto">
    <div class="flex gap-2 min-w-max" id="tradeFilters">
      <button onclick="setTradeFilter('all')" class="tab-btn active text-xs font-bold px-3 py-1.5 rounded-full transition" data-filter="all">All</button>
      <button onclick="setTradeFilter('general')" class="tab-btn text-xs font-bold px-3 py-1.5 rounded-full transition" data-filter="general">General</button>
      <button onclick="setTradeFilter('electrical')" class="tab-btn text-xs font-bold px-3 py-1.5 rounded-full transition" data-filter="electrical">Electrical</button>
      <button onclick="setTradeFilter('plumbing')" class="tab-btn text-xs font-bold px-3 py-1.5 rounded-full transition" data-filter="plumbing">Plumbing</button>
      <button onclick="setTradeFilter('hvac')" class="tab-btn text-xs font-bold px-3 py-1.5 rounded-full transition" data-filter="hvac">HVAC</button>
      <button onclick="setTradeFilter('framing')" class="tab-btn text-xs font-bold px-3 py-1.5 rounded-full transition" data-filter="framing">Framing</button>
      <button onclick="setTradeFilter('roofing')" class="tab-btn text-xs font-bold px-3 py-1.5 rounded-full transition" data-filter="roofing">Roofing</button>
      <button onclick="setTradeFilter('painting')" class="tab-btn text-xs font-bold px-3 py-1.5 rounded-full transition" data-filter="painting">Painting</button>
      <button onclick="setTradeFilter('concrete')" class="tab-btn text-xs font-bold px-3 py-1.5 rounded-full transition" data-filter="concrete">Concrete</button>
      <button onclick="setTradeFilter('drywall')" class="tab-btn text-xs font-bold px-3 py-1.5 rounded-full transition" data-filter="drywall">Drywall</button>
      <button onclick="setTradeFilter('flooring')" class="tab-btn text-xs font-bold px-3 py-1.5 rounded-full transition" data-filter="flooring">Flooring</button>
    </div>
  </div>

  <!-- Count -->
  <div class="px-4 py-2 text-xs text-gray-400 font-medium" id="guyCount"></div>

  <!-- Roster -->
  <main class="px-4 pb-24 max-w-2xl mx-auto w-full mt-1">
    <div id="rosterList" class="space-y-3"></div>

    <!-- Empty state -->
    <div id="emptyState" class="hidden text-center py-16">
      <div class="text-5xl mb-4">👷</div>
      <p class="text-gray-600 font-semibold text-lg">No guys yet</p>
      <p class="text-gray-400 text-sm mt-1 mb-6">Add a contact manually or scan a business card.</p>
      <button onclick="openAddModal()" style="background:#A0272D" class="text-white font-bold px-6 py-3 rounded-full hover:opacity-90 transition text-sm">
        + Add Your First Guy
      </button>
    </div>
  </main>

  <!-- Rolodex FAB -->
  <a href="index.html" style="background:#54585A" class="fixed bottom-6 right-6 z-40 text-white text-sm font-bold px-5 py-3 rounded-full shadow-lg hover:opacity-90 transition">
    Find a Pro
  </a>

  <!-- Add Contact Modal -->
  <div id="addModal" class="modal-overlay" onclick="closeAddModal(event)">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 overflow-hidden" onclick="event.stopPropagation()">
      <div style="background:#54585A" class="px-6 py-4 flex items-center justify-between">
        <div>
          <h2 class="text-white text-lg font-black">Add to My Guy</h2>
          <p class="text-gray-300 text-sm">Manual entry or scan a card</p>
        </div>
        <button onclick="closeAddModal()" class="text-gray-300 hover:text-white text-2xl leading-none">&times;</button>
      </div>

      <!-- Scan card CTA -->
      <div class="px-6 pt-5 pb-2">
        <button onclick="triggerCardScan()" class="w-full border-2 border-dashed border-gray-200 rounded-xl py-4 flex items-center justify-center gap-3 hover:border-red-300 hover:bg-red-50 transition group">
          <span class="text-3xl">📷</span>
          <div class="text-left">
            <p class="font-bold text-gray-700 group-hover:text-red-700 text-sm">Scan a Business Card</p>
            <p class="text-xs text-gray-400">Camera reads name, phone, trade automatically</p>
          </div>
        </button>
        <input id="cardScanInput" type="file" accept="image/*" capture="environment" class="hidden" onchange="handleCardScan(event)" />
      </div>

      <div class="px-6 py-2 flex items-center gap-3">
        <div class="flex-1 h-px bg-gray-100"></div>
        <span class="text-xs text-gray-400 font-medium">or enter manually</span>
        <div class="flex-1 h-px bg-gray-100"></div>
      </div>

      <div class="px-6 pb-6 space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Name *</label>
            <input id="addName" type="text" placeholder="John Rivera"
              class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-300" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Trade *</label>
            <select id="addTrade" class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-300 bg-white">
              <option value="">Select…</option>
              <option value="general">General</option>
              <option value="electrical">Electrical</option>
              <option value="plumbing">Plumbing</option>
              <option value="hvac">HVAC</option>
              <option value="framing">Framing</option>
              <option value="roofing">Roofing</option>
              <option value="painting">Painting</option>
              <option value="concrete">Concrete</option>
              <option value="drywall">Drywall</option>
              <option value="flooring">Flooring</option>
              <option value="carpentry">Carpentry</option>
              <option value="masonry">Masonry</option>
              <option value="landscape">Landscape</option>
              <option value="solar">Solar</option>
              <option value="pool">Pool</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Phone *</label>
          <input id="addPhone" type="tel" placeholder="+1 (951) 555-1234" maxlength="17"
            oninput="formatPhone(this)"
            class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-300" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Email</label>
            <input id="addEmail" type="email" placeholder="john@example.com"
              class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-300" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Company</label>
            <input id="addCompany" type="text" placeholder="Rivera Construction"
              class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-300" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Notes</label>
          <input id="addNotes" type="text" placeholder="Good on tile, fast turnaround"
            class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-300" />
        </div>
        <div id="addError" class="hidden bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl px-3 py-2"></div>
        <button onclick="saveGuy()" style="background:#A0272D" class="w-full text-white font-bold py-3 rounded-xl hover:opacity-90 transition text-sm">
          Add to My Guy
        </button>
      </div>
    </div>
  </div>

  <!-- Scan processing toast -->
  <div id="scanToast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-sm font-semibold px-5 py-3 rounded-full shadow-xl z-50 flex items-center gap-2">
    <span class="animate-spin">⚙️</span> Reading card…
  </div>

  <script>
    // ── Data store (localStorage) ──────────────────────────────────────────
    const API      = 'https://8bvjb1qz6g.execute-api.us-east-1.amazonaws.com/prod';
    const STORE_KEY = 'gcoffice_my_guys';

    function loadGuys() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
      catch { return []; }
    }

    function saveGuys(guys) {
      localStorage.setItem(STORE_KEY, JSON.stringify(guys));
    }

    // ── Seed demo data on first load ───────────────────────────────────────
    function seedDemo() {
      if (localStorage.getItem('gcoffice_seeded')) return;
      localStorage.setItem('gcoffice_seeded', '1');
      const demo = [
        { id: 1, name: 'John Rivera', company: 'Rivera Construction', trade: 'general',
          phone: '9515551234', email: 'john@riveraconstruction.com',
          notes: 'Reliable, good on commercial jobs', verified: true, added: '2025-01-10' },
        { id: 2, name: 'Mike Torres', company: 'Torres Electric', trade: 'electrical',
          phone: '9515559876', email: '',
          notes: 'Fast, knows panel upgrades cold', verified: true, added: '2025-02-14' },
        { id: 3, name: 'Carlos Mendez', company: '', trade: 'plumbing',
          phone: '9515554321', email: 'carlos@mendezplumbing.net',
          notes: '', verified: false, added: '2025-03-01' },
      ];
      saveGuys(demo);
    }

    // ── Render ─────────────────────────────────────────────────────────────
    let activeFilter = 'all';
    let searchQuery  = '';

    function tradeLabel(t) {
      return t ? t.charAt(0).toUpperCase() + t.slice(1) : 'Unknown';
    }

    function renderRoster() {
      const guys = loadGuys();
      const list = document.getElementById('rosterList');
      const empty = document.getElementById('emptyState');
      const count = document.getElementById('guyCount');

      const filtered = guys.filter(g => {
        const matchTrade  = activeFilter === 'all' || g.trade === activeFilter;
        const q = searchQuery.toLowerCase();
        const matchSearch = !q ||
          (g.name    || '').toLowerCase().includes(q) ||
          (g.company || '').toLowerCase().includes(q) ||
          (g.trade   || '').toLowerCase().includes(q) ||
          (g.phone   || '').includes(q);
        return matchTrade && matchSearch;
      });

      count.textContent = filtered.length
        ? `${filtered.length} contact${filtered.length !== 1 ? 's' : ''}`
        : '';

      if (!filtered.length) {
        list.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      list.innerHTML = filtered.map(g => `
        <div class="guy-card bg-white rounded-2xl shadow-sm border border-gray-100 p-4" data-id="${g.id}">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-full flex-shrink-0 flex items-center justify-center text-lg font-black text-white"
                 style="background:#54585A">${(g.name || '?')[0].toUpperCase()}</div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="font-bold text-gray-900 truncate">${g.name}</span>
                ${g.verified ? '<span class="text-green-600 text-xs font-bold">✓ Verified</span>' : ''}
              </div>
              ${g.company ? `<p class="text-xs text-gray-500 truncate">${g.company}</p>` : ''}
              <div class="flex items-center gap-2 mt-0.5">
                <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-gray-100 text-gray-600">${tradeLabel(g.trade)}</span>
                ${g.notes ? `<span class="text-xs text-gray-400 truncate">${g.notes}</span>` : ''}
              </div>
            </div>
          </div>
          <div class="flex gap-2 mt-3">
            <a href="tel:${g.phone}" style="background:#A0272D"
               class="flex-1 text-white text-sm font-bold py-2 rounded-xl text-center hover:opacity-90 transition">
              Call
            </a>
            <a href="sms:${g.phone}" style="background:#A0272D"
               class="flex-1 text-white text-sm font-bold py-2 rounded-xl text-center hover:opacity-90 transition">
              Text
            </a>
            <button onclick="shareGuy(${g.id})"
               class="flex-1 bg-gray-100 text-gray-700 text-sm font-bold py-2 rounded-xl hover:bg-gray-200 transition">
              Share
            </button>
            <button onclick="removeGuy(${g.id})"
               class="w-10 bg-gray-100 text-gray-400 text-sm font-bold py-2 rounded-xl hover:bg-red-50 hover:text-red-500 transition">
              ✕
            </button>
          </div>
        </div>
      `).join('');
    }

    // ── Filters ────────────────────────────────────────────────────────────
    function setTradeFilter(trade) {
      activeFilter = trade;
      document.querySelectorAll('#tradeFilters .tab-btn').forEach(b => {
        const on = b.dataset.filter === trade;
        b.classList.toggle('active', on);
      });
      renderRoster();
    }

    function filterGuys() {
      searchQuery = document.getElementById('searchInput').value;
      renderRoster();
    }

    // ── Add modal ──────────────────────────────────────────────────────────
    function openAddModal() {
      document.getElementById('addModal').classList.add('open');
      ['addName','addPhone','addEmail','addCompany','addNotes'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('addTrade').value = '';
      document.getElementById('addError').classList.add('hidden');
    }

    function closeAddModal(e) {
      if (e && e.target !== document.getElementById('addModal')) return;
      document.getElementById('addModal').classList.remove('open');
    }

    function saveGuy() {
      const name  = document.getElementById('addName').value.trim();
      const trade = document.getElementById('addTrade').value;
      const phone = document.getElementById('addPhone').value.trim().replace(/\D/g, '');
      const errEl = document.getElementById('addError');

      if (!name || !trade || !phone) {
        errEl.textContent = 'Name, trade, and phone are required.';
        errEl.classList.remove('hidden');
        return;
      }

      const guys = loadGuys();
      guys.unshift({
        id:      Date.now(),
        name,
        trade,
        phone,
        email:   document.getElementById('addEmail').value.trim(),
        company: document.getElementById('addCompany').value.trim(),
        notes:   document.getElementById('addNotes').value.trim(),
        verified: false,
        added:   new Date().toISOString().slice(0, 10),
      });
      saveGuys(guys);
      document.getElementById('addModal').classList.remove('open');
      renderRoster();
    }

    // ── Remove ─────────────────────────────────────────────────────────────
    function removeGuy(id) {
      if (!confirm('Remove from My Guy?')) return;
      saveGuys(loadGuys().filter(g => g.id !== id));
      renderRoster();
    }

    // ── Share ──────────────────────────────────────────────────────────────
    function shareGuy(id) {
      const g = loadGuys().find(g => g.id === id);
      if (!g) return;
      const phone = g.phone ? `(${g.phone.slice(0,3)}) ${g.phone.slice(3,6)}-${g.phone.slice(6)}` : '';
      const text = [
        `${g.name}${g.company ? ' — ' + g.company : ''}`,
        `${tradeLabel(g.trade)} Contractor`,
        phone,
        g.email || '',
        '\nFound on The GC\'s Office — thegcsoffice.com',
      ].filter(Boolean).join('\n');

      if (navigator.share) {
        navigator.share({ title: g.name, text }).catch(() => {});
      } else {
        navigator.clipboard.writeText(text).then(() => {
          showToast('📋 Copied to clipboard');
        });
      }
    }

    // ── Business card scan ─────────────────────────────────────────────────
    function triggerCardScan() {
      document.getElementById('cardScanInput').click();
    }

    async function handleCardScan(e) {
      const file = e.target.files[0];
      if (!file) return;
      e.target.value = '';

      const toast = document.getElementById('scanToast');
      toast.innerHTML = '<span>⚙️</span> Reading card…';
      toast.classList.remove('hidden');

      try {
        // 1. Get presigned upload URL
        const urlRes = await fetch(`${API}/api/card-upload-url`);
        const { url, key } = await urlRes.json();

        // 2. Upload image directly to S3
        await fetch(url, {
          method: 'PUT',
          headers: { 'Content-Type': 'image/jpeg' },
          body: file,
        });

        // 3. Run Textract via scan-card Lambda
        const scanRes = await fetch(`${API}/api/scan-card`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key }),
        });
        const fields = await scanRes.json();

        // 4. Prefill the form
        if (fields.name)    document.getElementById('addName').value    = fields.name;
        if (fields.email)   document.getElementById('addEmail').value   = fields.email;
        if (fields.company) document.getElementById('addCompany').value = fields.company;
        if (fields.phone) {
          const input = document.getElementById('addPhone');
          input.value = fields.phone;
          formatPhone(input);
        }

        toast.classList.add('hidden');
        showToast('📷 Card scanned — review and tap Add');

      } catch (err) {
        console.error(err);
        toast.classList.add('hidden');
        showToast('❌ Scan failed — enter details manually');
      }
    }

    function showToast(msg) {
      const t = document.getElementById('scanToast');
      t.innerHTML = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 2500);
    }

    // ── Phone formatter ────────────────────────────────────────────────────
    function formatPhone(input) {
      const digits = input.value.replace(/\D/g, '').replace(/^1/, '').slice(0, 10);
      let formatted = '';
      if (digits.length === 0) { formatted = ''; }
      else if (digits.length <= 3) { formatted = `+1 (${digits}`; }
      else if (digits.length <= 6) { formatted = `+1 (${digits.slice(0,3)}) ${digits.slice(3)}`; }
      else { formatted = `+1 (${digits.slice(0,3)}) ${digits.slice(3,6)}-${digits.slice(6)}`; }
      input.value = formatted;
    }

    // ── Init ───────────────────────────────────────────────────────────────
    seedDemo();
    renderRoster();
  </script>
</body>
</html>
